[package]
name = "roblox-account-manager"
version = "1.0.1"
description = "Roblox Account Manager — мульти-аккаунт лаунчер с современным UI"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
rfd = "0.15"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
