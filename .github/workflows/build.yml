name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build (frontend + Rust + NSIS)
        run: npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe release\
          $exe = Get-ChildItem src-tauri\target\release\*.exe |
            Where-Object { $_.Name -notmatch "-uninstall|setup" } | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath release\RobloxAccountManager-portable.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roblox-account-manager-windows
          path: release/*
          if-no-files-found: error
